<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1052" viewBox="0 0 1240 1052"><rect width="1240" height="1052" fill="#0A0B0C"/><rect x="52" y="56" width="172" height="25" fill="none" stroke="#eab94e" stroke-width="1.5"/><text x="64.0" y="73.0" font-size="11" fill="#eab94e" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif" letter-spacing="0.08em">MEASURED AND TARGET</text><text x="236.1" y="73.5" font-size="12.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif" letter-spacing="0.05em">OMNI-INKLING-2-MINI · WEIGHTS ON DISK, DECIMAL GB</text><text x="52.0" y="128.0" font-size="31" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Serif','DejaVu Serif',Georgia,serif">The map removes 27.0 GB of text encoder today. The 12 GB card is a</text><text x="52.0" y="165.8" font-size="31" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Serif','DejaVu Serif',Georgia,serif">target that has not been run.</text><text x="52.0" y="201.8" font-size="15.5" fill="#D3D5D1" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">The upper panel is byte counts recorded in the run reports. The lower panel is the sizes the paper draft aims for after stripping and quantizing</text><text x="52.0" y="225.8" font-size="15.5" fill="#D3D5D1" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">each part. Most parts do not exist at those sizes yet, and no card in the ladder has been run.</text><rect x="52" y="255.84500000000003" width="84" height="22" fill="none" stroke="#82C232" stroke-width="1.5"/><text x="62.0" y="271.3" font-size="10.5" fill="#82C232" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif" letter-spacing="0.08em">MEASURED</text><text x="150.0" y="271.8" font-size="14.5" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Language model with image generation, bytes on disk from the run reports</text><line x1="352.0" x2="352.0" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="352.0" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">0</text><line x1="457.7" x2="457.7" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="457.7" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">10 GB</text><line x1="563.4" x2="563.4" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="563.4" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">20 GB</text><line x1="669.1" x2="669.1" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="669.1" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">30 GB</text><line x1="774.9" x2="774.9" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="774.9" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">40 GB</text><line x1="880.6" x2="880.6" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="880.6" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">50 GB</text><line x1="986.3" x2="986.3" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="986.3" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">60 GB</text><line x1="1092.0" x2="1092.0" y1="303.845" y2="419.845" stroke="#2B3034"/><text x="1092.0" y="437.8" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">70 GB</text><text x="52.0" y="329.8" font-size="14" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">With the stock text encoder</text><rect x="352.0" y="309.845" width="206.4" height="30" fill="#4E7A22"/><text x="360.0" y="329.3" font-size="12" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Inkling-2-Mini 19.53</text><rect x="559.9" y="309.845" width="286.9" height="30" fill="#e5645a"/><text x="567.9" y="329.3" font-size="12" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">teacher encoder 27.14</text><rect x="848.3" y="309.845" width="221.8" height="30" fill="#5d656a"/><text x="856.3" y="329.3" font-size="12" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">image model 20.98</text><rect x="1071.6" y="309.845" width="12.4" height="30" fill="#8a9197"/><text x="1093.5" y="330.3" font-size="15" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">68.8 GB</text><text x="52.0" y="391.8" font-size="14" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">With the 90 MiB map</text><rect x="352.0" y="371.845" width="206.4" height="30" fill="#4E7A22"/><text x="360.0" y="391.3" font-size="12" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Inkling-2-Mini 19.53</text><rect x="559.9" y="371.845" width="3.0" height="30" fill="#eab94e"/><text x="561.4" y="416.8" font-size="11.5" fill="#eab94e" text-anchor="middle" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">map 0.094</text><rect x="564.4" y="371.845" width="221.8" height="30" fill="#5d656a"/><text x="572.4" y="391.3" font-size="12" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">image model 20.98</text><rect x="787.7" y="371.845" width="12.4" height="30" fill="#8a9197"/><text x="809.6" y="392.3" font-size="15" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">41.8 GB</text><text x="52.0" y="467.8" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">VAE 1.17 GB. Peak card memory measured with each stage loaded alone: teacher encoder 31.47 GB, Inkling-2-Mini 21.82 GB, image model with VAE 25.55 GB. Each is</text><text x="52.0" y="487.3" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">above its file size, so weights on disk understate the memory a card needs.</text><line x1="52" x2="1188" y1="533.345" y2="533.345" stroke="#2B3034"/><rect x="52" y="559.345" width="66" height="22" fill="none" stroke="#eab94e" stroke-width="1.5"/><text x="62.0" y="574.8" font-size="10.5" fill="#eab94e" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif" letter-spacing="0.08em">TARGET</text><text x="132.0" y="575.3" font-size="14.5" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">After stripping and quantizing, weights only, from the paper draft</text><text x="132.0" y="594.3" font-size="12" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">targets, not measurements; no card in this ladder has been run</text><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#0A0B0C"/><rect width="3" height="7" fill="#eab94e" fill-opacity="0.75"/></pattern></defs><line x1="352.0" x2="352.0" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="352.0" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">0</text><line x1="439.1" x2="439.1" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="439.1" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">4 GB</text><line x1="526.1" x2="526.1" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="526.1" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">8 GB</text><line x1="613.2" x2="613.2" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="613.2" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">12 GB</text><line x1="700.2" x2="700.2" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="700.2" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">16 GB</text><line x1="787.3" x2="787.3" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="787.3" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">20 GB</text><line x1="874.4" x2="874.4" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="874.4" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">24 GB</text><line x1="961.4" x2="961.4" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="961.4" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">28 GB</text><line x1="1048.5" x2="1048.5" y1="633.345" y2="811.345" stroke="#2B3034"/><text x="1048.5" y="829.3" font-size="11.5" fill="#A0A6A9" text-anchor="middle" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">32 GB</text><line x1="613.2" x2="613.2" y1="617.345" y2="811.345" stroke="#F4F3EE" stroke-width="1.5" stroke-dasharray="5 4"/><text x="607.2" y="613.3" font-size="11.5" fill="#F4F3EE" text-anchor="end" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">RTX 3060, 12 GB</text><line x1="874.4" x2="874.4" y1="617.345" y2="811.345" stroke="#F4F3EE" stroke-width="1.5" stroke-dasharray="5 4"/><text x="868.4" y="613.3" font-size="11.5" fill="#F4F3EE" text-anchor="end" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">RTX 3090 or 4090, 24 GB</text><line x1="1048.5" x2="1048.5" y1="617.345" y2="811.345" stroke="#F4F3EE" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1042.5" y="613.3" font-size="11.5" fill="#F4F3EE" text-anchor="end" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">RTX 5090, 32 GB</text><text x="52.0" y="653.3" font-size="14" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Voice, sight and text</text><text x="52.0" y="670.3" font-size="11.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">trunk, four maps, sight, ears, mouth</text><rect x="352" y="639.345" width="179.6" height="30" fill="url(#hatch)" stroke="#eab94e" stroke-width="1"/><rect x="531.6" y="639.345" width="108.8" height="30" fill="none" stroke="#eab94e" stroke-width="1" stroke-dasharray="3 3"/><text paint-order="stroke" stroke="#0A0B0C" stroke-width="7" stroke-linejoin="round" x="650.4" y="659.8" font-size="15" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">8.25 to 13.25 GB</text><line x1="596.9" x2="596.9" y1="634.345" y2="674.345" stroke="#F4F3EE" stroke-width="2.5"/><text x="596.9" y="688.3" font-size="11.5" fill="#F4F3EE" text-anchor="end" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">11.25 with a trunk of 8.5 GB</text><text x="52.0" y="715.3" font-size="14" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Image model alone</text><text x="52.0" y="732.3" font-size="11.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">NVFP4 file on disk, with VAE</text><rect x="352" y="701.345" width="298.3" height="30" fill="url(#hatch)" stroke="#eab94e" stroke-width="1"/><rect x="650.3" y="701.345" width="0.0" height="30" fill="none" stroke="#eab94e" stroke-width="1" stroke-dasharray="3 3"/><text paint-order="stroke" stroke="#0A0B0C" stroke-width="7" stroke-linejoin="round" x="660.3" y="721.8" font-size="15" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">13.71 GB</text><text x="52.0" y="777.3" font-size="14" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">All four resident</text><text x="52.0" y="794.3" font-size="11.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">voice, sight, text and image</text><rect x="352" y="763.345" width="477.9" height="30" fill="url(#hatch)" stroke="#eab94e" stroke-width="1"/><rect x="829.9" y="763.345" width="108.8" height="30" fill="none" stroke="#eab94e" stroke-width="1" stroke-dasharray="3 3"/><text paint-order="stroke" stroke="#0A0B0C" stroke-width="7" stroke-linejoin="round" x="948.7" y="783.8" font-size="15" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">21.96 to 26.96 GB</text><text x="52.0" y="865.3" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Hatched to the low end of each target, dashed outline to the high end. Parts, in GB: trunk 6.0 to 10.5, four maps 0.16 (one measured file, three computed from their</text><text x="52.0" y="884.8" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">shapes), sight tower 0.19, ears 0.4 to 0.6, mouth 1.5 to 1.8. Totals are the sums of the parts. The image model at its quantized size on disk is above 12 GB by itself; 10 to</text><text x="52.0" y="904.3" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">11 GB is a further packing target.</text><line x1="52" x2="1188" y1="950.345" y2="950.345" stroke="#F4F3EE" stroke-width="1"/><text x="52.0" y="974.3" font-size="12.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Upper panel: file sizes of the pinned checkpoints and the fitted map, and peak card memory, as recorded in the Packet A run report. Lower panel:</text><text x="52.0" y="993.1" font-size="12.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">targets, except the quantized image model, the VAE and the sight tower, which are files on disk. Weights exclude working memory during generation,</text><text x="52.0" y="1011.8" font-size="12.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">and the multi-card sweep that would measure them is pending.</text><text x="1188.0" y="974.3" font-size="12.5" fill="#A0A6A9" text-anchor="end" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">github.com/Atlas3DSS/atlas-ingine</text></svg>
