xt x="833.3" y="743.8" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">correct overall of 192, variance matched against plain</text><text x="833.3" y="763.3" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">ridge (teacher 89). McNemar p = 0.727. Variance matching</text><text x="833.3" y="782.8" font-size="13" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">was rejected.</text><line x1="52" x2="1188" y1="832.845" y2="832.845" stroke="#F4F3EE" stroke-width="1"/><text x="52.0" y="856.8" font-size="12.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">192 development images, 1,408 images used to fit the map. The locked test set was not touched. The shuffled control is the same solver fitted on</text><text x="52.0" y="875.6" font-size="12.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">mismatched image pairs; the one shown is the control matched to the plain ridge map.</text><text x="1188.0" y="856.8" font-size="12.5" fill="#A0A6A9" text-anchor="end" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">github.com/Atlas3DSS/atlas-ingine</text></svg>
