<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="916" viewBox="0 0 1240 916"><rect width="1240" height="916" fill="#0A0B0C"/><rect x="52" y="56" width="91" height="25" fill="none" stroke="#82C232" stroke-width="1.5"/><text x="64.0" y="73.0" font-size="11" fill="#82C232" text-anchor="start" font-weight="700" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif" letter-spacing="0.08em">MEASURED</text><text x="155.1" y="73.5" font-size="12.5" fill="#A0A6A9" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif" letter-spacing="0.05em">CACHED VISION FEATURES TO INKLING-2-MINI · 192 DEVELOPMENT IMAGES, 48 PER DOMAIN</text><text x="52.0" y="128.0" font-size="31" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Serif','DejaVu Serif',Georgia,serif">The linear vision bridge carries counting and layout (45 of 48 match</text><text x="52.0" y="165.8" font-size="31" fill="#F4F3EE" text-anchor="start" font-weight="700" font-family="'Noto Serif','DejaVu Serif',Georgia,serif">the teacher) and loses text (1 to 3 of 48)</text><text x="52.0" y="201.8" font-size="15.5" fill="#D3D5D1" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">A ridge map sends cached low-resolution vision features into Inkling-2-Mini in place of its own vision tokens. The teacher is the model</text><text x="52.0" y="225.8" font-size="15.5" fill="#D3D5D1" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">answering from its native vision tokens. Rescaling the map to the teacher's variance did not help.</text><rect x="52" y="258.845" width="13" height="13" fill="#F4F3EE"/><text x="72.0" y="269.8" font-size="13" fill="#D3D5D1" text-anchor="start" font-weight="400" font-family="'Noto Sans','Liberation Sans',Arial,sans-serif">Teacher</text><rect x="149.915283203125" y="258.845" width="13" height="13" fill="#82C232"/><text x="169.9" y="26