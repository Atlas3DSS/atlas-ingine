<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON GALACTICA — Astro Vanguard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#03040a; overflow:hidden; font-family:'Courier New',monospace; }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; background:#05060f; image-rendering:pixelated; border:2px solid #1b2a4a; box-shadow:0 0 40px #0ff3, 0 0 120px #06f3; border-radius:6px; }
  #scanlines { position:absolute; inset:0; pointer-events:none; border-radius:6px;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,.22) 4px);
    mix-blend-mode:multiply; }
  #vignette { position:absolute; inset:0; pointer-events:none; border-radius:6px;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(3,4,12,.78); border-radius:6px; text-align:center; z-index:5; }
  .hidden { display:none !important; }
  h1 { font-size:clamp(28px,6vw,64px); letter-spacing:.12em; color:#7df9ff;
    text-shadow:0 0 8px #0ff,0 0 30px #0ff,0 0 60px #08f; margin-bottom:8px; }
  h2 { font-size:clamp(14px,2.2vw,22px); letter-spacing:.4em; color:#ff4fd8; text-shadow:0 0 12px #f0f; margin-bottom:26px; }
  .prompt { font-size:clamp(12px,1.6vw,18px); color:#e8f6ff; letter-spacing:.2em; margin-top:22px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.15; } }
  #finalScore { font-size:clamp(18px,3vw,32px); color:#ffd24f; text-shadow:0 0 14px #fa0; margin:14px 0; }
  #startBtn, #restartBtn { margin-top:18px; padding:12px 34px; font-family:inherit; font-size:clamp(13px,1.8vw,20px);
    letter-spacing:.25em; color:#031; background:#7dff4f; border:none; border-radius:4px; cursor:pointer;
    box-shadow:0 0 18px #7dff4f; font-weight:bold; }
  #startBtn:hover, #restartBtn:hover { background:#b6ff9e; box-shadow:0 0 28px #7dff4f; }
  .hint { margin-top:16px; font-size:clamp(9px,1.1vw,12px); color:#5f7ba6; letter-spacing:.15em; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="titleScreen" class="overlay">
    <h1>NEON GALACTICA</h1>
    <h2>ASTRO VANGUARD</h2>
    <div class="prompt">PRESS ENTER / SPACE OR CLICK START</div>
    <button id="startBtn">START</button>
    <div class="hint">&#8592; &#8594; / A D MOVE &nbsp;•&nbsp; SPACE FIRE &nbsp;•&nbsp; R RESTART</div>
  </div>
  <div id="gameoverScreen" class="overlay hidden">
    <h1 style="color:#ff4f6a;text-shadow:0 0 8px #f04,0 0 30px #f04">GAME OVER</h1>
    <div id="finalScore">SCORE 0</div>
    <div class="prompt">PRESS ENTER / SPACE / R TO RESTART</div>
    <button id="restartBtn">RESTART</button>
  </div>
</div>
<script>
(function(){
'use strict';
var W=1280,H=720;
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var titleScreen=document.getElementById('titleScreen');
var gameoverScreen=document.getElementById('gameoverScreen');
var finalScore=document.getElementById('finalScore');
var startBtn=document.getElementById('startBtn');
var restartBtn=document.getElementById('restartBtn');

// ---------- Audio (guarded) ----------
var actx=null;
function initAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume().catch(function(){}); return; }
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; }
}
function tone(freq,dur,type,vol,slideTo){
  if(!actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,actx.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur+0.02);
  }catch(e){}
}
function noise(dur,vol){
  if(!actx) return;
  try{
    var len=Math.floor(actx.sampleRate*dur);
    var buf=actx.createBuffer(1,len,actx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var s=actx.createBufferSource(); s.buffer=buf;
    var g=actx.createGain(); g.gain.setValueAtTime(vol||0.2,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    s.connect(g); g.connect(actx.destination); s.start();
  }catch(e){}
}
function sfx(name){
  if(!actx) return;
  if(name==='pew') tone(920,0.12,'square',0.07,180);
  else if(name==='explosion') noise(0.4,0.28);
  else if(name==='hit'){ tone(160,0.35,'sawtooth',0.22,40); noise(0.3,0.2); }
  else if(name==='wave'){ tone(520,0.1,'square',0.12); setTimeout(function(){tone(660,0.1,'square',0.12);},110); setTimeout(function(){tone(880,0.18,'square',0.12);},220); }
  else if(name==='gameover'){ tone(440,0.25,'sawtooth',0.16,220); setTimeout(function(){tone(330,0.25,'sawtooth',0.16,160);},260); setTimeout(function(){tone(220,0.5,'sawtooth',0.16,55);},520); }
  else if(name==='enemyfire') tone(300,0.14,'triangle',0.05,120);
}
window.addEventListener('pointerdown',initAudio);
window.addEventListener('keydown',initAudio);

// ---------- State ----------
var state='title';
var score=0, highScore=0, lives=3, wave=1, collisions=0;
try{ highScore=parseInt(localStorage.getItem('neonGalacticaHigh')||'0',10)||0; }catch(e){}
var player={x:W/2,y:H-90,r:16,invuln:0,fireCd:0};
var playerBullets=[], enemyBullets=[], enemies=[], particles=[];
var shake=0, time=0, formationDir=1, formationSpeed=55, fireTimer=0.9;
var keys={};

var TIERS=[
  {points:200,hp:2,color:'#ff4fd8',r:22},
  {points:150,hp:2,color:'#ffd24f',r:20},
  {points:100,hp:1,color:'#4fffd8',r:19},
  {points:50, hp:1,color:'#7dff4f',r:17}
];

var stars=[];
for(var i=0;i<160;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,z:[0.25,0.55,1][i%3],s:Math.random()<0.2?2:1});
}

function spawnWave(n){
  enemies=[];
  var rows=4, cols=8;
  var spacingX=118, spacingY=58;
  var totalW=(cols-1)*spacingX;
  var startX=(W-totalW)/2;
  var startY=110;
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      enemies.push({
        x:startX+c*spacingX,
        y:startY+r*spacingY,
        tier:r,
        hp:TIERS[r].hp+(n>3?1:0),
        maxHp:TIERS[r].hp+(n>3?1:0),
        bobPhase:Math.random()*Math.PI*2,
        r:TIERS[r].r
      });
    }
  }
  formationDir=Math.random()<0.5?-1:1;
  formationSpeed=55+Math.min(120,(n-1)*14);
  fireTimer=0.9;
}

function resetGame(){
  score=0; lives=3; wave=1; collisions=0;
  playerBullets=[]; enemyBullets=[]; particles=[];
  player.x=W/2; player.y=H-90; player.invuln=0; player.fireCd=0;
  shake=0;
  spawnWave(1);
}

function startGame(){
  initAudio();
  resetGame();
  state='playing';
  titleScreen.classList.add('hidden');
  gameoverScreen.classList.add('hidden');
}

function endGame(){
  state='gameover';
  if(score>highScore){
    highScore=score;
    try{ localStorage.setItem('neonGalacticaHigh',String(highScore)); }catch(e){}
  }
  finalScore.textContent='SCORE '+score+(score>=highScore&&score>0?'  ★ NEW HIGH SCORE':'');
  gameoverScreen.classList.remove('hidden');
  sfx('gameover');
}

// ---------- Input ----------
window.addEventListener('keydown',function(e){
  var k=e.code;
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='Space'||k==='ArrowUp'||k==='ArrowDown') e.preventDefault();
  keys[k]=true;
  if(state!=='playing'){
    if(k==='Enter'||k==='Space') startGame();
    else if(k==='KeyR'&&state==='gameover') startGame();
  } else if(k==='Space'){
    firePlayer(); // immediate fire on press
  }
});
window.addEventListener('keyup',function(e){ keys[e.code]=false; });
startBtn.addEventListener('click',function(){ if(state!=='playing') startGame(); });
restartBtn.addEventListener('click',function(){ if(state!=='playing') startGame(); });

// ---------- Spawning ----------
function nearestEnemy(x){
  var best=null, bd=Infinity;
  for(var i=0;i<enemies.length;i++){
    var d=Math.abs(enemies[i].x-x)+Math.max(0,enemies[i].y-player.y)*0.1;
    if(d<bd){ bd=d; best=enemies[i]; }
  }
  return best;
}
function firePlayer(){
  if(player.fireCd>0) return;
  player.fireCd=0.14;
  var target=nearestEnemy(player.x);
  var spread=9;
  var offs=[-spread,spread];
  for(var i=0;i<2;i++){
    var bx=player.x+offs[i];
    var vx=0;
    if(target){
      // aim assist: slight x-velocity toward nearest enemy
      var dx=target.x-bx;
      vx=Math.max(-160,Math.min(160,dx*2.2));
    }
    playerBullets.push({x:bx,y:player.y-22,vx:vx,vy:-900});
  }
  sfx('pew');
}
function fireEnemy(e){
  var dx=player.x-e.x, dy=player.y-e.y;
  var d=Math.sqrt(dx*dx+dy*dy)||1;
  var sp=210+Math.min(120,(wave-1)*15)+Math.random()*30;
  enemyBullets.push({x:e.x,y:e.y+e.r,vx:dx/d*sp*0.5,vy:Math.abs(dy/d)*sp+70});
  sfx('enemyfire');
}
function explode(x,y,color,n){
  for(var i=0;i<(n||18);i++){
    var a=Math.random()*Math.PI*2, sp=60+Math.random()*260;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.5,maxLife:0.9,color:color||'#ffd24f',size:2+Math.random()*4});
  }
}
function damagePlayer(){
  if(player.invuln>0) return;
  lives--;
  explode(player.x,player.y,'#7df9ff',30);
  shake=Math.max(shake,14);
  player.invuln=0.6;
  sfx('hit');
  if(lives<=0){
    explode(player.x,player.y,'#ff4f6a',50);
    endGame();
  }
}

// ---------- Update ----------
function update(dt){
  time+=dt;
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    s.y+=s.z*90*dt;
    if(s.y>H){ s.y=-2; s.x=Math.random()*W; }
  }
  shake=Math.max(0,shake-dt*30);

  if(state!=='playing'){
    for(var p=particles.length-1;p>=0;p--){
      var pt=particles[p];
      pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=140*dt; pt.life-=dt;
      if(pt.life<=0) particles.splice(p,1);
    }
    return;
  }

  // player movement
  var move=0;
  if(keys['ArrowLeft']||keys['KeyA']) move-=1;
  if(keys['ArrowRight']||keys['KeyD']) move+=1;
  player.x+=move*440*dt;
  player.x=Math.max(30,Math.min(W-30,player.x));
  player.invuln=Math.max(0,player.invuln-dt);
  player.fireCd=Math.max(0,player.fireCd-dt);
  if(keys['Space']) firePlayer();

  // formation movement
  var minX=Infinity,maxX=-Infinity;
  for(var j=0;j<enemies.length;j++){ minX=Math.min(minX,enemies[j].x); maxX=Math.max(maxX,enemies[j].x); }
  if(enemies.length){
    var dx=formationDir*formationSpeed*dt;
    if(minX+dx<40||maxX+dx>W-40){ formationDir*=-1; for(var k=0;k<enemies.length;k++) enemies[k].y+=16; }
    else { for(var m=0;m<enemies.length;m++) enemies[m].x+=dx; }
  }

  // enemy fire
  fireTimer-=dt;
  if(fireTimer<=0&&enemies.length){
    fireTimer=Math.max(0.5,0.95-wave*0.05);
    var e=enemies[Math.floor(Math.random()*enemies.length)];
    if(e) fireEnemy(e);
  }

  // player bullets
  for(var b=playerBullets.length-1;b>=0;b--){
    var pb=playerBullets[b];
    pb.x+=pb.vx*dt; pb.y+=pb.vy*dt;
    if(pb.y<-20||pb.x<-20||pb.x>W+20){ playerBullets.splice(b,1); continue; }
    for(var en=enemies.length-1;en>=0;en--){
      var enemy=enemies[en];
      var ddx=pb.x-enemy.x, ddy=pb.y-enemy.y;
      var rr=enemy.r+12;
      if(ddx*ddx+ddy*ddy < rr*rr){
        collisions++;
        enemy.hp--;
        playerBullets.splice(b,1);
        if(enemy.hp<=0){
          score+=TIERS[enemy.tier].points;
          explode(enemy.x,enemy.y,TIERS[enemy.tier].color,20);
          shake=Math.max(shake,5);
          sfx('explosion');
          enemies.splice(en,1);
        } else {
          explode(pb.x,pb.y,'#ffffff',6);
        }
        break;
      }
    }
  }

  // enemy bullets
  for(var eb=enemyBullets.length-1;eb>=0;eb--){
    var bullet=enemyBullets[eb];
    bullet.x+=bullet.vx*dt; bullet.y+=bullet.vy*dt;
    if(bullet.y>H+20||bullet.x<-20||bullet.x>W+20){ enemyBullets.splice(eb,1); continue; }
    var pdx=bullet.x-player.x, pdy=bullet.y-player.y;
    if(pdx*pdx+pdy*pdy < (player.r+8)*(player.r+8)){
      enemyBullets.splice(eb,1);
      damagePlayer();
      if(state!=='playing') return;
      continue;
    }
  }

  // enemy vs player
  for(var ep=enemies.length-1;ep>=0;ep--){
    var en2=enemies[ep];
    var ex=en2.x-player.x, ey=en2.y-player.y;
    if(ex*ex+ey*ey < (en2.r+player.r-2)*(en2.r+player.r-2)){
      explode(en2.x,en2.y,TIERS[en2.tier].color,22);
      enemies.splice(ep,1);
      sfx('explosion');
      damagePlayer();
      if(state!=='playing') return;
    }
  }

  // particles
  for(var q=particles.length-1;q>=0;q--){
    var pp=particles[q];
    pp.x+=pp.vx*dt; pp.y+=pp.vy*dt; pp.vy+=140*dt; pp.life-=dt;
    if(pp.life<=0) particles.splice(q,1);
  }

  // wave clear
  if(enemies.length===0&&state==='playing'){
    wave++;
    sfx('wave');
    spawnWave(wave);
  }
}

// ---------- Drawing ----------
function drawPlayer(){
  if(player.invuln>0 && Math.floor(time*18)%2===0) return;
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.shadowColor='#7df9ff'; ctx.shadowBlur=18;
  ctx.fillStyle='#7df9ff';
  ctx.beginPath();
  ctx.moveTo(0,-26); ctx.lineTo(10,6); ctx.lineTo(26,20); ctx.lineTo(10,16); ctx.lineTo(0,22); ctx.lineTo(-10,16); ctx.lineTo(-26,20); ctx.lineTo(-10,6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e8fbff';
  ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(4,4); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
  var f=10+Math.random()*12;
  ctx.fillStyle='#ffb84f';
  ctx.beginPath(); ctx.moveTo(-6,20); ctx.lineTo(0,20+f); ctx.lineTo(6,20); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawEnemy(e){
  var bob=Math.sin(time*3+e.bobPhase)*4;
  var y=e.y+bob;
  ctx.save();
  ctx.translate(e.x,y);
  var tier=TIERS[e.tier];
  ctx.shadowColor=tier.color; ctx.shadowBlur=14;
  ctx.fillStyle=tier.color;
  var wig=Math.sin(time*6+e.bobPhase)*3;
  if(e.tier===0){
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.quadraticCurveTo(0,-24,16,-6); ctx.lineTo(10,6); ctx.lineTo(-10,6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=tier.color; ctx.lineWidth=3;
    for(var i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*8,6); ctx.lineTo(i*8+wig*(i===0?1:-1),20); ctx.stroke(); }
  } else if(e.tier===1){
    ctx.beginPath(); ctx.ellipse(0,0,18,11,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-20,-6,5,0,Math.PI*2); ctx.arc(20,-6,5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=tier.color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-14,6); ctx.lineTo(-22,14+wig); ctx.moveTo(14,6); ctx.lineTo(22,14-wig); ctx.stroke();
  } else if(e.tier===2){
    ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(16,0); ctx.lineTo(0,18); ctx.lineTo(-16,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0a0f1e';
    ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(15,12); ctx.lineTo(-15,12); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0a0f1e';
    ctx.fillRect(-6,2,4,6); ctx.fillRect(2,2,4,6);
  }
  if(e.maxHp>1){
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(-12,-e.r-10,24*(e.hp/e.maxHp),3);
  }
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#070a1c'); grad.addColorStop(0.6,'#0a0d24'); grad.addColorStop(1,'#120a24');
  ctx.fillStyle=grad; ctx.fillRect(-20,-20,W+40,H+40);

  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.fillStyle='rgba(255,255,255,'+(0.35+s.z*0.6)+')';
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }

  ctx.shadowBlur=0;
  ctx.fillStyle='#0a0f22'; ctx.fillRect(0,0,W,52);
  ctx.strokeStyle='#1b2a4a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,52); ctx.lineTo(W,52); ctx.stroke();
  ctx.font='bold 20px "Courier New",monospace';
  ctx.textAlign='left'; ctx.fillStyle='#7df9ff'; ctx.fillText('SCORE '+String(score).padStart(6,'0'),24,33);
  ctx.textAlign='center'; ctx.fillStyle='#ffd24f'; ctx.fillText('HIGH '+String(Math.max(highScore,score)).padStart(6,'0'),W/2,33);
  ctx.textAlign='right'; ctx.fillStyle='#7dff4f'; ctx.fillText('WAVE '+wave,W-24,33);
  ctx.textAlign='right'; ctx.fillStyle='#ff4f6a'; ctx.fillText('LIVES '+'♥'.repeat(Math.max(0,lives)),W-140,33);

  for(var j=0;j<enemies.length;j++) drawEnemy(enemies[j]);

  ctx.shadowColor='#7df9ff'; ctx.shadowBlur=12; ctx.fillStyle='#bffbff';
  for(var b=0;b<playerBullets.length;b++){ ctx.fillRect(playerBullets[b].x-3,playerBullets[b].y-12,6,16); }
  ctx.shadowColor='#ff5f7a'; ctx.shadowBlur=14; ctx.fillStyle='#ff9aa8';
  for(var eb=0;eb<enemyBullets.length;eb++){
    ctx.beginPath(); ctx.arc(enemyBullets[eb].x,enemyBullets[eb].y,6,0,Math.PI*2); ctx.fill();
  }

  if(state==='playing') drawPlayer();

  for(var p=0;p<particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha=Math.max(0,pt.life/pt.maxLife);
    ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
  }
  ctx.globalAlpha=1;

  ctx.restore();
}

// ---------- Main loop ----------
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  draw();

  window.__GAME_STATE__={
    state:state,
    score:score,
    lives:lives,
    wave:wave,
    playerX:player.x,
    playerY:player.y,
    collisions:collisions,
    enemies:enemies.map(function(e){ return {x:e.x,y:e.y,hp:e.hp}; }),
    enemyBullets:enemyBullets.map(function(b){ return {x:b.x,y:b.y}; }),
    playerBullets:playerBullets.map(function(b){ return {x:b.x,y:b.y}; })
  };

  requestAnimationFrame(loop);
}
resetGame();
state='title';
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
